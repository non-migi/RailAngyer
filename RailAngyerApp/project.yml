# XcodeGen のプロジェクト定義
#
# .xcodeproj はこのファイルから生成する。手で編集しない。
#   再生成:  xcodegen generate --spec RailAngyerApp/project.yml
#
# ふだんの開発は Xcode でそのまま行ってよい。
# ターゲットや依存を増やしたときだけ、このファイルを直して再生成する。

name: RailAngyerApp

options:
  # 多言語対応（ParadoxLab と同じ8言語）。**正は日本語**
  developmentLanguage: ja
  bundleIdPrefix: com.non-migi
  deploymentTarget:
    iOS: "17.0"          # SwiftData の要件
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RailAngyerCore:
    path: ../RailAngyerCore
  # 利用状況の測定。**個人を識別しない形でだけ送る**（`Telemetry.swift`）
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0

# シミュレータの位置シミュレーション用。
# ターゲットには含めず、プロジェクトに置くだけで
# Xcode の Debug → Simulate Location から選べるようになる
fileGroups:
  - ../tools

targets:

  RailAngyerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: RailAngyerCore
      - package: TelemetryDeck
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: レイルアンギャー
        # **日本語のアプリとして名乗る。** 既定の en のままだと、
        # 端末が日本語でも `Date.formatted()` が「Aug 2, 2026 at 9:00」になる
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
          - en
          - de
          - es
          - fr
          - ko
          - ru
          - zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # TelemetryDeck の App ID。**空のあいだは何も送らない**。
        # telemetrydeck.com で発行したUUIDを入れると測定が始まる
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        LSApplicationCategoryType: public.app-category.games
        # 共有したリンクからアプリを開き、そのままルームへ入れるようにする。
        # 「railangyer://join?code=ABC123」の形（`10_アプリ設計.md`「ルームを誘う」）
        CFBundleURLTypes:
          - CFBundleURLName: com.non-migi.RailAngyerApp
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - railangyer
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BrandMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- 位置情報（10_アプリ設計.md §6.6）---
        NSLocationWhenInUseUsageDescription:
          駅に到着したことを判定するために現在地を使います。
        NSLocationAlwaysAndWhenInUseUsageDescription:
          画面を見ていない間も駅への到着を検知するために、常に現在地を使います。
        # --- 写真 ---
        NSCameraUsageDescription:
          到着した駅で写真を撮るためにカメラを使います。
        NSPhotoLibraryUsageDescription:
          撮影できない端末では、駅の記録に写真を追加するためライブラリから選びます。
        # --- バックグラウンドでの測位 ---
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.non-migi.RailAngyerApp
        DEVELOPMENT_LANGUAGE: ja
        # 発行したら差し替える。空のままなら測定は動かない（送信しない）
        TELEMETRYDECK_APP_ID: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "20"
        TARGETED_DEVICE_FAMILY: "1"        # iPhone のみ
        SWIFT_VERSION: "5.0"               # 当面は Swift 5 モードで進める
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: 949FXAWTYZ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RailAngyerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RailAngyerApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  # 位置情報の到着判定は、実際に歩かせないと確かめられないため UIテストで検証する
  RailAngyerAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RailAngyerApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RailAngyerApp:
    build:
      targets:
        RailAngyerApp: all
        RailAngyerAppTests: [test]
        RailAngyerAppUITests: [test]
    test:
      targets:
        - RailAngyerAppTests
        - RailAngyerAppUITests
