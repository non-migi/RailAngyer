# XcodeGen のプロジェクト定義
#
# .xcodeproj はこのファイルから生成する。手で編集しない。
#   再生成:  xcodegen generate --spec RailAngyerApp/project.yml
#
# ふだんの開発は Xcode でそのまま行ってよい。
# ターゲットや依存を増やしたときだけ、このファイルを直して再生成する。

name: RailAngyerApp

options:
  bundleIdPrefix: com.non-migi
  deploymentTarget:
    iOS: "17.0"          # SwiftData の要件
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RailAngyerCore:
    path: ../RailAngyerCore

targets:

  RailAngyerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: RailAngyerCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: レイルアンギャー
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- 位置情報（10_アプリ設計.md §6.6）---
        NSLocationWhenInUseUsageDescription:
          駅に到着したことを判定するために現在地を使います。
        NSLocationAlwaysAndWhenInUseUsageDescription:
          画面を見ていない間も駅への到着を検知するために、常に現在地を使います。
        # --- 写真 ---
        NSCameraUsageDescription:
          到着した駅で写真を撮るためにカメラを使います。
        NSPhotoLibraryAddUsageDescription:
          撮った写真を端末に保存します。
        # --- バックグラウンドでの測位 ---
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.non-migi.RailAngyerApp
        TARGETED_DEVICE_FAMILY: "1"        # iPhone のみ
        SWIFT_VERSION: "5.0"               # 当面は Swift 5 モードで進める
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""               # 実機で動かすときに自分のTeam IDを入れる
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RailAngyerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RailAngyerApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  # 位置情報の到着判定は、実際に歩かせないと確かめられないため UIテストで検証する
  RailAngyerAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RailAngyerApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RailAngyerApp:
    build:
      targets:
        RailAngyerApp: all
        RailAngyerAppTests: [test]
        RailAngyerAppUITests: [test]
    test:
      targets:
        - RailAngyerAppTests
        - RailAngyerAppUITests
